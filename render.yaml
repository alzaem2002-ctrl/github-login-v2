services:
  - type: web
    name: github-login-v2
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: github-login-v2-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: NOTION_API_KEY
        sync: false

databases:
  - name: github-login-v2-db
    plan: free
    databaseName: github_login_v2
    user: github_login_user
